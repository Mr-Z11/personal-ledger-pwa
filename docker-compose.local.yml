# Local sync compose — runs postgres + api + caddy on your home computer.
# Usage:  cp .env.local.example .env.local && edit it, then:
#         docker compose -f docker-compose.local.yml --env-file .env.local up -d

services:
  postgres-local:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/local-postgres:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-local:
    image: ${API_IMAGE:-ghcr.io/mr-z11/personal-ledger-pwa-api:main}
    # GHCR prebuilt images are linux/amd64 only (built for the x86 cloud server);
    # run emulated on Apple Silicon via colima's qemu binfmt.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: "*"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ledger@example.com}
    depends_on:
      postgres-local:
        condition: service_healthy
    # 本地构建的 api dist 直接挂进容器，覆盖镜像内的 dist。
    # 作用：① 后端纯 JS 改动（如 19 点表扬阈值）只需 `npm --workspace @ledger/api run build`
    #       再 `compose up -d api-local` 即可生效，无需从 GHCR 拉取 amd64 镜像
    #       （本机 VM 网络对 GHCR blob CDN 偶发 TLS 握手超时，拉取不稳）；
    #       ② 容器重建 / colima 重启后修复不回退。
    # 注意：若后端新增 npm 依赖，需同步更新镜像内的 node_modules（pull 新镜像或本地 build）。
    volumes:
      - ./apps/api/dist:/app/apps/api/dist:ro

  caddy-local:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${LOCAL_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./data/local-caddy:/data
      - ./data/local-caddy-config:/config
      - ./apps/web/dist:/srv/web:ro
    depends_on:
      - api-local
