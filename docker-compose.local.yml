# Local sync compose — runs postgres + api + caddy on your home computer.
# Usage:  cp .env.local.example .env.local && edit it, then:
#         docker compose -f docker-compose.local.yml --env-file .env.local up -d

services:
  postgres-local:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/local-postgres:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-local:
    image: ${API_IMAGE:-ghcr.io/mr-z11/personal-ledger-pwa-api:main}
    # GHCR prebuilt images are linux/amd64 only (built for the x86 cloud server);
    # run emulated on Apple Silicon via colima's qemu binfmt.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: "*"
    depends_on:
      postgres-local:
        condition: service_healthy

  caddy-local:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${LOCAL_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./data/local-caddy:/data
      - ./data/local-caddy-config:/config
      - ./apps/web/dist:/srv/web:ro
    depends_on:
      - api-local
